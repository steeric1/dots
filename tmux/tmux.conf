unbind r
bind r source-file ~/.config/tmux/tmux.conf

unbind C-b
set -g prefix C-p
bind C-p send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key m display-popup -w 80% -h 60%

bind p split-window -h   # Vertical split (side-by-side)
bind o split-window -v   # Horizontal split (stacked)

set-option -g status-position top
set -as terminal-overrides ",*:allow-bold=true"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark256' # or 'dark256', 'light', 'light256'

#set -g @dracula-show-left-icon "#[bold]WSL | #S"

#source-file ~/.config/tmux/.tmux.snazzy.theme

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
